services:
  signet:
    image: signet:local
    build:
      context: .
      dockerfile: apps/signet/Dockerfile
    restart: unless-stopped
    pids_limit: 100
    # Prisma + Fastify + the relay pool need headroom; 256MB risked OOM kills.
    mem_limit: 512mb
    memswap_limit: 512mb
    volumes:
      # Holds the SQLite DB and signet.json (secrets). The container runs as uid 1000;
      # ensure this host directory is writable by uid 1000.
      - $HOME/.signet-config:/app/config
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/app/config/signet.db}
      SIGNET_PORT: ${SIGNET_PORT:-3000}
      SIGNET_HOST: ${SIGNET_HOST:-0.0.0.0}
      EXTERNAL_URL: ${EXTERNAL_URL:-http://localhost:4174}
    # The web dashboard reaches the daemon over the compose network and does NOT
    # need this port published. It is exposed here for the Android app, which talks
    # to the daemon's REST API directly. The daemon has no built-in auth by default,
    # so restrict who can reach this port (Tailscale ACLs / firewall), or bind it to
    # a specific interface, e.g.: "${SIGNET_HOST:-127.0.0.1}:${SIGNET_PORT:-3000}:${SIGNET_PORT:-3000}".
    ports:
      - "${SIGNET_PORT:-3000}:${SIGNET_PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${SIGNET_PORT:-3000}/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  signet-ui:
    build:
      context: .
      dockerfile: apps/signet-ui/Dockerfile
    restart: unless-stopped
    depends_on:
      signet:
        condition: service_healthy
    environment:
      UI_PORT: ${UI_PORT:-4174}
      UI_HOST: ${UI_HOST:-0.0.0.0}
      DAEMON_URL: ${DAEMON_URL:-http://signet:${SIGNET_PORT:-3000}}
    ports:
      - "${UI_PORT:-4174}:${UI_PORT:-4174}"
